<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Marcellus;src:url(../fonts/Marcellus-Regular.ttf)}
@font-face{font-family:Jost;font-weight:300;src:url(../fonts/Jost-Light.ttf)}
@font-face{font-family:Jost;font-weight:400;src:url(../fonts/Jost-Regular.ttf)}
@font-face{font-family:Jost;font-weight:500;src:url(../fonts/Jost-Medium.ttf)}
*{margin:0;box-sizing:border-box}
#b{position:relative;width:1128px;height:191px;overflow:hidden;font-family:Jost;
 background:radial-gradient(60% 140% at 50% 50%,#4a3424 0%,#2d2018 45%,#1b130e 100%)}
.glow{position:absolute;left:50%;top:50%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;
 background:radial-gradient(circle,rgba(255,190,120,.30) 0%,rgba(240,169,104,.12) 38%,rgba(240,169,104,0) 65%)}
.ring{position:absolute;left:50%;top:50%;width:300px;height:300px;transform:translate(-50%,-50%);border-radius:50%;
 border:1.5px solid rgba(255,200,140,.75);
 box-shadow:0 0 22px 3px rgba(240,169,104,.55),0 0 60px 12px rgba(240,169,104,.22),inset 0 0 26px 4px rgba(255,211,160,.25)}
.logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;line-height:1}
.the{font-size:11px;letter-spacing:.55em;padding-left:.55em;color:#F2E7DB}
.aura{font-weight:300;font-size:50px;letter-spacing:.3em;padding-left:.3em;color:#FFD3A0;margin:4px 0 4px;
 text-shadow:0 0 18px rgba(240,169,104,.45)}
.rc{display:flex;align-items:center;gap:12px;font-size:12.5px;letter-spacing:.48em;color:#F2E7DB}
.rc:before,.rc:after{content:"";width:34px;height:1px;background:#C79A6D}
.rc span{padding-left:.48em}
.nsr{margin-top:9px;font-size:8px;letter-spacing:.42em;padding-left:.42em;color:#F0A968;font-weight:500}
.side{position:absolute;top:50%;transform:translateY(-50%);color:#E9DDD0}
.l{right:calc(50% + 205px);text-align:right}
.r{left:calc(50% + 205px)}
.k{font-size:9px;letter-spacing:.38em;text-transform:uppercase;color:#C79A6D;font-weight:500}
.v{font-family:Marcellus;font-size:21px;color:#FBF5EE;margin-top:7px;white-space:nowrap}
.s{font-size:10.5px;letter-spacing:.14em;color:rgba(233,221,208,.7);margin-top:7px;white-space:nowrap}
.line{position:absolute;top:50%;height:1px;width:46px;background:linear-gradient(90deg,transparent,#A6754C)}
</style></head><body>
<div id="b"><div class="glow"></div><div class="ring"></div>
 <div class="side l"><div class="k">A recovery studio</div><div class="v">Reset · Heal · Elevate</div>
   <div class="s">Cryo · Red light · Hyperbaric · Breath · Sound</div></div>
 <div class="logo"><div class="the">THE</div><div class="aura">AURA</div><div class="rc"><span>RESET CENTER</span></div>
   <div class="nsr">NERVOUS SYSTEM REGULATION</div></div>
 <div class="side r"><div class="k">332 Jumeirah First</div><div class="v">Jumeirah 1 · Dubai</div>
   <div class="s">Technology by Elevé Health</div></div>
</div></body></html>
