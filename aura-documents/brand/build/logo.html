<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Marcellus;src:url(../fonts/Marcellus-Regular.ttf)}
@font-face{font-family:Jost;font-weight:300;src:url(../fonts/Jost-Light.ttf)}
@font-face{font-family:Jost;font-weight:400;src:url(../fonts/Jost-Regular.ttf)}
@font-face{font-family:Jost;font-weight:500;src:url(../fonts/Jost-Medium.ttf)}
html,body{margin:0;background:transparent}
.l{display:inline-flex;flex-direction:column;align-items:center;padding:24px 40px;font-family:Jost;color:var(--c)}
.the{font-size:22px;letter-spacing:.55em;padding-left:.55em;font-weight:400;color:var(--m)}
.aura{font-size:96px;letter-spacing:.32em;padding-left:.32em;font-weight:300;line-height:1.05;color:var(--c)}
.rc{display:flex;align-items:center;gap:22px;font-size:26px;letter-spacing:.5em;font-weight:400;color:var(--m)}
.rc:before,.rc:after{content:"";width:60px;height:1.5px;background:var(--line)}
.rc span{padding-left:.5em}
.nsr{margin-top:14px;font-size:15px;letter-spacing:.42em;padding-left:.42em;color:var(--c);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:#F0A968;box-shadow:0 0 10px 3px rgba(240,169,104,.6);margin:12px 0 2px}
</style></head><body>
<div class="l" id="logo"><div class="the">THE</div><div class="aura">AURA</div><div class="rc"><span>RESET CENTER</span></div><div class="dot"></div><div class="nsr">NERVOUS SYSTEM REGULATION</div></div>
<script>const p=new URLSearchParams(location.search);const d=p.get('v')==='dark';const s=document.documentElement.style;
s.setProperty('--c',d?'#FFD3A0':'#A6754C');s.setProperty('--m',d?'#F2E7DB':'#4A3A2C');s.setProperty('--line',d?'#C79A6D':'#C79A6D');</script>
</body></html>
